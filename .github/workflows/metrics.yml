name: Metrics

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: carteraccs

          filename: github-metrics.svg
          output_action: none

          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Indianapolis

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base

      - name: Copy generated metrics
        run: |
          sudo cp /metrics_renders/github-metrics.svg ./github-metrics.svg
          sudo chown "$(id -u):$(id -g)" ./github-metrics.svg

      - name: Commit metrics as Tiago
        run: |
          git config user.name "tiagoodevs"
          git config user.email "tiagu.1789@gmail.com"

          git add github-metrics.svg

          if git diff --cached --quiet; then
            echo "Metrics haven't changed. Nothing to commit."
            exit 0
          fi

          git commit -m "chore: update metrics graphics [skip ci]"
          git push
